<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Management - Hybrid</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f46e5">
<style>
:root{--p:#4f46e5;--bg:#f8fafc;--card:#ffffff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:var(--bg);color:var(--text);padding:12px;max-width:480px;margin:auto}
.header{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;padding:16px;border-radius:16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:12px;z-index:10}
.header h1{font-size:18px}.header p{font-size:11px;opacity:.9}
.sync{font-size:10px;background:rgba(255,255,255,.25);padding:4px 8px;border-radius:20px}
.sync.online{background:#10b981}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center}
.stat b{font-size:20px;display:block}.stat span{font-size:10px;color:var(--muted)}
.toolbar{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
.toolbar input{flex:1;min-width:140px;padding:10px 12px;border:1px solid var(--border);border-radius:10px}
.btn{padding:10px 14px;border-radius:10px;border:none;font-weight:600;font-size:12px;cursor:pointer}
.btn-p{background:var(--p);color:#fff}.btn-g{background:#e2e8f0;color:#334155}.btn-s{background:#10b981;color:#fff}
.media-list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;display:flex;justify-content:space-between;align-items:center}
.card.present{border-color:#10b981;background:#f0fdf4}
.check{width:24px;height:24px;border-radius:6px;border:2px solid #cbd5e1;display:grid;place-items:center;cursor:pointer;font-size:14px}
.check.on{background:#10b981;border-color:#10b981;color:#fff}
.icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:#fff;display:grid;place-items:center;cursor:pointer}
.add-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;margin-top:12px}
.add-box input{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;margin:6px 0}
</style>
</head>
<body>
<div class="header">
<div><h1>Media Management</h1><p>Hybrid • Offline + Auto Sync • 27 Media</p></div>
<div class="sync online" id="syncStatus">● Offline Ready</div>
</div>

<div class="stats">
<div class="stat"><b id="totalCount">27</b><span>TOTAL</span></div>
<div class="stat"><b id="presentCount">0</b><span>PRESENT</span></div>
<div class="stat"><b id="pendingCount">27</b><span>PENDING</span></div>
</div>

<div class="toolbar">
<input id="search" placeholder="🔍 Search media (Dainik...)" oninput="render()">
<button class="btn btn-g" onclick="exportExcel()">⬇ Excel for Client</button>
<button class="btn btn-s" onclick="shareBackup()">📤 Backup</button>
</div>

<div id="mediaList" class="media-list"></div>

<div class="add-box">
<b>Add New Media House</b>
<input id="newName" placeholder="Media Name (e.g. Amar Ujala)">
<input id="newPerson" placeholder="Person Name">
<input id="newPhone" placeholder="Phone Number">
<button class="btn btn-p" style="width:100%;margin-top:6px" onclick="addMedia()">+ Add & Auto-Sync to All Staff</button>
<p style="font-size:10px;color:#64748b;text-align:center;margin-top:6px">🔒 Only admin can delete</p>
</div>

<div style="display:flex;gap:6px;margin:20px 0">
<button class="btn btn-g" onclick="resetAttendance()">Reset Attendance</button>
<button class="btn btn-g" onclick="toggleAdmin()">🔐 <span id="adminLabel">Admin: ON</span></button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// REPLACE WITH YOUR FIREBASE CONFIG FOR AUTO-SYNC (optional)
// If you don't replace, app still works 100% offline with ZERO data
const firebaseConfig = {
  apiKey: "REPLACE_WITH_YOUR_KEY",
  authDomain: "media-hybrid-demo.firebaseapp.com",
  projectId: "media-hybrid-demo",
};
let db=null,useCloud=false;
try{
  if(firebaseConfig.apiKey.includes("REPLACE")==false){
    const app=initializeApp(firebaseConfig);
    db=getFirestore(app);
    useCloud=true;
  }
}catch(e){useCloud=false;}

const DEFAULT_MEDIA = [
{name:"Dainik Bhaskar"},{name:"Voice of Lucknow"},{name:"Jan Madhyam"},{name:"Lucknow Express"},
{name:"News 18 UP"},{name:"Zee News UP"},{name:"Aaj Tak"},{name:"ABP Ganga"},
{name:"Amar Ujala"},{name:"Dainik Jagran"},{name:"Hindustan"},{name:"Rashtriya Sahara"},
{name:"Swatantra Bharat"},{name:"Pratahkal"},{name:"ETV Bharat"},{name:"Sahara Samay"},
{name:"News State UP"},{name:"Khabar Fast"},{name:"INH News"},{name:"The Pioneer"},
{name:"Times of India Lucknow"},{name:"Hindustan Times"},{name:"Navbharat Times"},
{name:"Qaumi Morcha"},{name:"Awam-e-Hind"},{name:"Lucknow Tribune"},{name:"UP Ki Baat"}
].map((m,i)=>({...m,person:"",phone:"",id:i,present:false}));

let media = JSON.parse(localStorage.getItem('media_hybrid')||'null') || DEFAULT_MEDIA;
let isAdmin = localStorage.getItem('isAdmin')!=='false';

function saveLocal(){
  localStorage.setItem('media_hybrid', JSON.stringify(media));
  if(useCloud && navigator.onLine){
    setDoc(doc(db,"media_list","main"), {data:media, updated:Date.now()}, {merge:true}).catch(()=>{});
    document.getElementById('syncStatus').innerText='● Synced';
    document.getElementById('syncStatus').className='sync online';
  }else{
    document.getElementById('syncStatus').innerText='● Offline - Saved Locally';
  }
}

window.render=function(){
  const q=document.getElementById('search').value.toLowerCase();
  const list=document.getElementById('mediaList');
  list.innerHTML='';
  let present=0;
  media.forEach((m,idx)=>{
    if(q && !m.name.toLowerCase().includes(q)) return;
    if(m.present) present++;
    const div=document.createElement('div');
    div.className='card'+(m.present?' present':'');
    div.innerHTML=`
      <div style="flex:1"><b style="font-size:13px">${m.name}</b><br><small style="font-size:11px;color:#64748b">${m.person||'No person'} • ${m.phone||'No number'}</small></div>
      <div style="display:flex;gap:6px;align-items:center">
        <div class="check ${m.present?'on':''}" onclick="togglePresent(${idx})">${m.present?'✓':''}</div>
        <button class="icon-btn" onclick="callMedia('${m.phone}')">📞</button>
        <button class="icon-btn" onclick="waMedia('${m.phone}','${m.name}')">💬</button>
        ${isAdmin?`<button class="icon-btn" onclick="deleteMedia(${idx})">🗑</button>`:''}
      </div>`;
    list.appendChild(div);
  });
  document.getElementById('totalCount').innerText=media.length;
  document.getElementById('presentCount').innerText=present;
  document.getElementById('pendingCount').innerText=media.length-present;
}

window.togglePresent=function(i){media[i].present=!media[i].present;saveLocal();render();}
window.callMedia=function(p){if(p) window.open('tel:'+p); else alert('No number');}
window.waMedia=function(p,name){if(!p){alert('No number');return;} let msg=encodeURIComponent(`Hi ${name}, thanks for coverage - Raj Media`); window.open(`https://wa.me/${p.replace(/\D/g,'')}?text=${msg}`,'_blank');}
window.addMedia=function(){
  const n=document.getElementById('newName').value.trim();
  const per=document.getElementById('newPerson').value.trim();
  const ph=document.getElementById('newPhone').value.trim();
  if(!n){alert('Enter media name');return;}
  media.push({id:Date.now(),name:n,person:per,phone:ph,present:false});
  document.getElementById('newName').value='';document.getElementById('newPerson').value='';document.getElementById('newPhone').value='';
  saveLocal();render();
}
window.deleteMedia=function(i){if(!isAdmin) return; if(confirm('Delete '+media[i].name+'?')){media.splice(i,1);saveLocal();render();}}
window.resetAttendance=function(){if(confirm('Reset all Present?')){media.forEach(m=>m.present=false);saveLocal();render();}}
window.toggleAdmin=function(){isAdmin=!isAdmin;localStorage.setItem('isAdmin',isAdmin);document.getElementById('adminLabel').innerText='Admin: '+(isAdmin?'ON':'OFF');render();}
window.exportExcel=function(){
  let csv="S.No,Media Name,Person,Phone,Attendance,Date\n";
  const date=new Date().toLocaleDateString();
  media.forEach((m,i)=>{csv+=`${i+1},"${m.name}","${m.person}","${m.phone}",${m.present?'Present':'Absent'},${date}\n`;});
  const blob=new Blob([csv],{type:'text/csv'});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`Attendance_${date}.csv`;a.click();
}
window.shareBackup=function(){
  const data=JSON.stringify(media);const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`backup.json`;a.click();
}

if(useCloud){
  onSnapshot(doc(db,"media_list","main"), (snap)=>{
    if(snap.exists()){
      const cloudData=snap.data().data;
      if(cloudData && cloudData.length>media.length){
        media=cloudData;
        localStorage.setItem('media_hybrid', JSON.stringify(media));
        render();
        document.getElementById('syncStatus').innerText='● Auto-Updated from Cloud';
      }
    }
  });
}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
render();
document.getElementById('adminLabel').innerText='Admin: '+(isAdmin?'ON':'OFF');
</script>
</body>
</html>
